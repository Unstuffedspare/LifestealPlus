name: LifestealPlus
version: '${version}'
main: dev.lifestealplus.LifestealPlugin
api-version: '26.3'
folia-supported: true
description: Lifesteal SMP core with a full heart ledger.
softdepend: [PlaceholderAPI, WorldGuard, Vault]
libraries:
  - org.xerial:sqlite-jdbc:${sqliteVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}

permissions:
  lifestealplus.hearts:
    description: Check your own hearts with /hearts.
    default: true
  lifestealplus.hearts.others:
    description: Check another player's hearts with /hearts <player>.
    default: true
  lifestealplus.bounty:
    description: Place, list and check bounties with /bounty.
    default: true
  lifestealplus.vengeance:
    description: See your vengeance marks with /vengeance.
    default: true
  lifestealplus.shield:
    description: See your new-player shield with /shield.
    default: true
  lifestealplus.leaderboard:
    description: See the leaderboard and past seasons with /leaderboard and /seasons.
    default: true
  lifestealplus.withdraw:
    description: Turn your own hearts into Heart items with /withdraw.
    default: true
  lifestealplus.rift:
    description: Pay hearts to bring an eliminated player back with /rift.
    default: true
  lifestealplus.pledge:
    description: Pledge hearts toward reviving someone with /pledge.
    default: true
  lifestealplus.pact:
    description: Make and break Blood Pacts with /pact.
    default: true
  lifestealplus.ghost:
    description: Roam as a ghost while eliminated with /ghost.
    default: true
  lifestealplus.whisper:
    description: Whisper to a living player while eliminated with /whisper.
    default: true
  lifestealplus.purgatory:
    description: Use /purgatory to see your progress and call or join trials while eliminated.
    default: true
  lifestealplus.giveheart:
    description: Give some of your hearts to another player with /giveheart.
    default: true
  lifestealplus.heartshop:
    description: Buy heart items with money through /heartshop.
    default: true
  lifestealplus.stats:
    description: See season records with /stats.
    default: true
  lifestealplus.streak:
    description: See kill streaks with /streak.
    default: true
  lifestealplus.news:
    description: See what's been happening with /news.
    default: true
  lifestealplus.admin:
    description: Everything under /lifesteal, and alt-account alerts. Grants all five parts below.
    default: op
    children:
      lifestealplus.admin.hearts: true
      lifestealplus.admin.settings: true
      lifestealplus.admin.events: true
      lifestealplus.admin.season: true
      lifestealplus.admin.records: true
  lifestealplus.admin.hearts:
    description: Change and inspect hearts (give, take, set, revive, ledger, shield, bounty clear).
    default: op
  lifestealplus.admin.settings:
    description: Change settings (settings menu, config, presets, reload, features), and hear about updates.
    default: op
  lifestealplus.admin.events:
    description: Run events (Blood Moons, airdrops, Double Hearts and the rest, King of the Hill, the finale, items, Most Wanted).
    default: op
  lifestealplus.admin.season:
    description: End and start seasons, and see past seasons even when they're private.
    default: op
  lifestealplus.admin.records:
    description: The dashboard, audit log, backups, exports, imports, and alt-account checks and alerts.
    default: op
