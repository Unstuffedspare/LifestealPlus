# =============================================================================
#  LifestealPlus settings
# =============================================================================
#  - Every feature has its own section with an `enabled` switch.
#  - Easiest: /lifesteal settings in game opens a menu where you click to change
#    anything, and /lifesteal config <setting> <value> works from the console.
#    Both save to this file and take effect straight away.
#  - Or change anything here, then run /lifesteal reload. The few settings marked
#    (restart) only take effect when the server restarts.
#  - A value that doesn't make sense won't break anything: the plugin uses the
#    default instead and tells you which setting it skipped, in the server log
#    and in the reply to /lifesteal reload.
#  - /lifesteal features shows what's switched on right now.
#  - Every message players see is in messages.yml.
# =============================================================================

hearts:
  # Hearts a brand-new player starts with.
  starting: 10
  # Most hearts anyone can have. A killer at the cap still takes the victim's heart
  # but doesn't gain it. Lowering this never takes hearts from players above it.
  # To give someone their own cap, give them the permission lifestealplus.max-hearts.<n>,
  # e.g. lifestealplus.max-hearts.30 (with a permissions plugin such as LuckPerms).
  max: 20
  # Optional: a cap that rises through the season, one value per week from the
  # season's start, e.g. [15, 20, 25]. After the last week the last value holds.
  # Leave it empty to always use max above.
  max-by-week: []
  # Hearts a player comes back with when revived (by an admin, Purgatory, a rift or a vote).
  revive: 3
  # Hearts that move from victim to killer on a PvP kill.
  per-kill: 1
  # Hearts lost dying to anything other than a player (mobs, falling, lava). 0 = none.
  natural-death-loss: 1
  # Those hearts drop as Heart items where the player died, glowing so they're easy to
  # find. They can't burn or despawn, so the player (or whoever gets there first) can
  # pick them back up. Off = the hearts are simply gone.
  natural-death-drops: true

worlds:
  # Worlds where nothing lifesteal happens: dying costs no hearts, kills take none, and
  # combat tags, newbie shields and Most Wanted leave players alone. Good for a creative,
  # event or minigame world. Use the world's folder name, e.g. [creative, events].
  excluded: []

repeat-kills:
  # Killing the same player again within the cooldown moves no hearts: the killer
  # gains nothing and the victim keeps theirs. Stops friends farming each other and
  # spawn-camping. A revenge kill the other way still counts.
  enabled: true
  cooldown-hours: 6

vengeance:
  # When someone takes your heart, you mark them. Kill them back within the time
  # limit and you take your heart back plus a bonus, from them.
  enabled: true
  minutes: 30
  bonus-hearts: 1
  tracker:
    # While you hold a mark, the bar above your hotbar points toward your target.
    enabled: true
    # Distances are rounded to this many blocks, so the tracker can't be used to aim.
    round-to-blocks: 10

bounties:
  # /bounty place <player> <hearts>: stake your own hearts on someone's head.
  # Whoever kills them collects the lot.
  enabled: true
  # Announce new bounties without naming who placed them (admins can still check the ledger).
  anonymous: true
  # /bounty undo <player>: take back your own bounty, refunded in full, within this many
  # minutes of placing it. Not while the target is in a fight, and everyone sees the bounty
  # shrink. 0 = bounties can't be taken back.
  undo-minutes: 5

streaks:
  # Kills that take a heart, in a row, without dying. Long streaks are announced, and
  # whoever ends one takes extra hearts from the player on the streak. /streak shows yours.
  enabled: true
  # Streak lengths announced to everyone.
  announce-at: [3, 5, 10]
  # Ending a streak at least this long takes bonus hearts from the streaker, on top of
  # the normal heart. 0 = no bonus.
  shutdown-at: 5
  shutdown-bonus-hearts: 1

newbie-shield:
  # First-time players can't be hurt by other players, and can't lose or gain hearts,
  # for this many hours of playtime. Attacking anyone ends it early.
  # Turning this off suspends existing shields too.
  enabled: true
  hours: 3
  # The shield also ends this many days after a player first joins, however little
  # they've played, so nobody keeps it forever. 0 = no limit.
  expires-after-days: 3

combat-log:
  # Hitting or being hit by another player puts you both in combat for a while.
  # Logging out in combat leaves your body behind: if someone kills it, you die
  # (they get your heart and your items drop).
  enabled: true
  tag-seconds: 15
  body-seconds: 30

eliminations:
  # When someone loses their last heart, everyone sees it on screen as well as in chat.
  # (The chat messages, one for each way of going out, are in messages.yml.)
  title: true
  # And hears this: a Minecraft sound name like entity.wither.spawn or
  # ui.toast.challenge_complete. none = silent.
  sound: entity.wither.spawn

rewards:
  # Ways to earn hearts without fighting: Heart Fragments for milestones. (Fragments
  # combine into Hearts; see heart-items.fragments-per-heart.)
  enabled: true
  # Advancements, by the id /advancement shows, and how many fragments each gives.
  # Each player gets them once, the first time they earn the advancement. Add any
  # advancement here; set one to 0 to give nothing for it.
  advancements:
    "minecraft:story/enter_the_nether": 1
    "minecraft:nether/obtain_ancient_debris": 1
    "minecraft:story/enter_the_end": 2
    "minecraft:end/kill_dragon": 4
    "minecraft:nether/create_full_beacon": 2
  # Every this many hours played this season gives fragments. 0 = none.
  playtime-hours: 2
  playtime-fragments: 1

combat-items:
  # Switches for the items lifesteal servers argue about most. Switched off, an item
  # stops working against players but still works otherwise.
  # Totems of Undying save players from death.
  totems: true
  # End crystal explosions hurt players. Off = no crystal PvP; crystals still break
  # blocks and can respawn the dragon.
  end-crystals: true
  # Respawn anchors used outside the Nether, and beds used in the Nether or the End,
  # explode and hurt players.
  bed-and-anchor-explosions: true

last-stand:
  # Players down to this many hearts get Strength I and Speed I until they recover.
  enabled: true
  hearts: 1

most-wanted:
  # Every so often, the online player with the most hearts has their rough location
  # announced to everyone.
  enabled: true
  interval-minutes: 120
  # Coordinates are rounded to the nearest this many blocks.
  precision-blocks: 100
  # Nobody is singled out unless at least this many players are online.
  min-players-online: 3

purgatory:
  # Eliminated players go to Purgatory, a separate world where they can win their way
  # back. When off, eliminated players spectate instead. (restart)
  enabled: true
  # Folder name for the Purgatory world. It's created and built automatically. (restart)
  world: lifesteal_purgatory
  # Trials a player has to win to come back.
  fragments-needed: 3
  # After a win, how long before that player can earn another fragment. They can still
  # join trials meanwhile to help others.
  trial-cooldown-minutes: 20
  # How hard trials are. 1.0 is normal; 0.5 is gentler, 1.5 harsher.
  difficulty: 1.0

rifts:
  # /rift <player>: one living player pays hearts to bring an eliminated player back.
  enabled: true
  cost: 6

revival-votes:
  # /pledge <player> <hearts>: living players chip in hearts to bring someone back.
  # They return once the pledges reach hearts-needed from at least min-players players.
  # Pledges are refunded if the player comes back another way.
  enabled: true
  hearts-needed: 6
  min-players: 3

trading:
  # /giveheart <player> <hearts>: hand some of your hearts straight to another player.
  # Admins are alerted when accounts that share an address trade (alt-detection).
  enabled: true
  # Percent of every gift lost on the way (rounded down). 0 = none.
  tax-percent: 0

heart-shop:
  # /heartshop: buy Hearts, Heart Fragments and Revival Charms with money. Needs Vault and
  # an economy plugin (EssentialsX, CMI and so on). Off unless you switch it on.
  enabled: false
  heart-price: 5000
  fragment-price: 1000
  # 0 = charms aren't sold.
  charm-price: 20000
  # Most items one player can buy per day. 0 = no limit.
  daily-limit: 2

revival:
  # How long after being eliminated before anyone can bring a player back with a rift, a
  # pledge or a Revival Charm. Purgatory and admins aren't held back. 0 = straight away.
  cooldown-minutes: 10
  # Each time a player was already eliminated this season, bringing them back costs this
  # many more hearts: on a rift, and on the pledges needed.
  extra-cost-per-elimination: 1

revival-charm:
  # A craftable item: right-click it to pick an eliminated player and bring them back
  # (with hearts.revive hearts). Crafted with one item in the corners, one on the sides
  # and one in the middle.
  enabled: true
  corners: totem_of_undying
  sides: diamond_block
  middle: nether_star

blood-pacts:
  # /pact <player>: two players share the hearts they win from kills and bounties,
  # and when either dies the other loses a heart too. Turning this off ends all pacts.
  enabled: true
  # How long someone who breaks a pact waits before making another.
  break-cooldown-hours: 24
  # Show pacts in the tab list (needs tab-list enabled).
  show-in-tab: true

ghosts:
  # /ghost: eliminated players can roam the overworld as spectators.
  enabled: true
  whispers:
    # /whisper <player> <message>: an eliminated player's one way to reach the living.
    enabled: true
    every-minutes: 60
  # Eliminated players' chat (and /msg) only reaches other eliminated players and admins.
  limit-chat: true

heart-items:
  # Hearts and Heart Fragments come from airdrops, Blood Moons, /withdraw, crafting
  # (below) and players' deaths to mobs (hearts.natural-death-drops).
  # Holding this many fragments and right-clicking turns them into a Heart.
  fragments-per-heart: 4
  withdraw:
    # /withdraw [hearts]: turn your own hearts into Heart items.
    enabled: true
    # Percent of withdrawn hearts lost in the process (rounded down). 0 = none.
    tax-percent: 0
  decay:
    # Heart items fade so nobody can hoard them: each loses an equal share of its value
    # per day and is gone after this many days. Old Hearts break into fragments when used.
    enabled: true
    days: 4
  recipe:
    # Hearts can be crafted on a crafting table: one item in the four corners, another on
    # the four sides, and a third in the middle. Use item names like diamond_block.
    enabled: true
    corners: diamond_block
    sides: gold_block
    middle: netherite_ingot

blood-moon:
  # Now and then the overworld falls into a long night: kills take extra hearts and
  # monsters can drop Heart Fragments.
  enabled: true
  # Roughly how often, in real days. The exact time is random.
  every-days: 7
  # Or fixed times instead, e.g. [saturday 20:00] or [daily 21:00, sunday 15:00].
  # The time zone is set under schedules. Empty = random, using every-days.
  schedule: []
  # Warn everyone this many minutes before a Blood Moon rises.
  warn-minutes: [10]
  minutes: 20
  kill-multiplier: 2
  # Chance (0 to 1) that a monster killed by a player drops a Heart Fragment.
  fragment-chance: 0.02
  min-players-online: 3

airdrops:
  # Heart crates fall at announced coordinates.
  enabled: true
  every-minutes: 90
  # Or fixed landing times instead, e.g. [daily 18:00, saturday 15:00]. Empty = every-minutes.
  schedule: []
  # Crates land within this many blocks of the overworld spawn.
  radius: 1500
  # The landing spot is announced this many minutes ahead.
  warning-minutes: 5
  # A crate disappears this long after landing, opened or not.
  despawn-minutes: 20
  # Chance (0 to 1) that a crate is golden: twice the loot and an extra Heart.
  golden-chance: 0.1
  min-players-online: 3

double-hearts:
  # A stretch where every kill takes extra hearts. Started by an admin with
  # /lifesteal event doublehearts start [minutes], or at the times in schedule.
  minutes: 30
  multiplier: 2
  # e.g. [saturday 19:00]. Empty = only when an admin starts it.
  schedule: []

heart-frenzy:
  # A stretch where monsters killed by players often drop Heart Fragments, anywhere.
  # /lifesteal event frenzy start [minutes], or at the times in schedule.
  minutes: 20
  # Chance (0 to 1) of a fragment per monster.
  fragment-chance: 0.1
  schedule: []

cap-boost:
  # The heart cap goes up for a while. Hearts gained above the usual cap are kept after.
  # /lifesteal event capboost start [minutes], or at the times in schedule.
  minutes: 60
  extra-hearts: 5
  schedule: []

king-of-the-hill:
  # /lifesteal event koth start [minutes] marks a hill where you stand. Each second exactly
  # one player is on it, they score; whoever holds it longest wins hearts.
  minutes: 10
  # How far from the centre counts as on the hill, in blocks.
  radius: 6
  prize-hearts: 2

schedules:
  # Time zone for every event schedule (Blood Moons, airdrops and the rest), like Europe/London or
  # America/New_York. server = the server's own clock.
  time-zone: server

finale:
  # Started by an admin with /lifesteal finale start <minutes> [final size]. The border
  # closes, portals shut, and nobody comes back from Purgatory.
  # How much the border hurts per block outside it, per second.
  damage-per-block: 1.0

alt-detection:
  # Notice accounts logging in from the same address and alert admins when they kill each
  # other (it never blocks anything, since family and friends often share a network).
  # Addresses are stored as a salted hash, not as text. That keeps them out of sight, but
  # anyone with the database file could still work out an address by trying them all.
  enabled: true
  # Forget an address this many days after it was last used.
  keep-days: 90

tab-list:
  # Show hearts (and pacts) next to names in the tab list. The look is set in messages.yml.
  enabled: true

recap:
  # Players coming back after a while get a short "while you were away" summary:
  # eliminations, comebacks, streaks, bounties and events. /news shows the latest.
  enabled: true
  # Only for players who've been away at least this long.
  min-away-hours: 1
  # Lines in the summary; /news has the rest.
  lines: 5
  # How long news is kept.
  keep-days: 14

discord:
  # Post the server's news (eliminations, comebacks, long streaks, bounties and events) to a
  # Discord channel. Paste the channel's webhook link here, from the channel's settings >
  # Integrations > Webhooks. none = don't post.
  webhook-url: none

seasons:
  # Let everyone see past seasons with /seasons and /leaderboard <season>.
  public-history: true

lifestealz-import:
  # Coming from LifeStealZ? /lifesteal import lifestealz brings everyone's hearts over
  # (it shows what it will do first). This setting swaps LifeStealZ's heart items for
  # this plugin's Hearts whenever a player has one or opens a container holding one.
  convert-items: true

backups:
  # Copies of the heart database in plugins/LifestealPlus/backups: one every every-hours, and
  # one before every season reset. /lifesteal backup lists them, /lifesteal backup restore
  # <file> [player] puts one player (or, after a restart, everything) back.
  enabled: true
  every-hours: 24
  # How many automatic and manual backups to keep; the oldest go first.
  keep: 7

updates:
  # Look for a newer version on GitHub when the server starts and twice a day, and tell
  # admins when they join. Only the public list of releases is fetched; nothing is sent.
  check: true

database:
  # SQLite file inside the plugin folder. (restart)
  file: lifesteal.db
