  # <count>, <player>
  bounties-cleared: "<green>Cleared <count> bounties on <player> and refunded the placers."
  # <player>, <time>
  shield-set: "<green><player> now has a new-player shield for <time>."
  # <player>
  shield-removed: "<green>Removed <player>'s new-player shield."
  most-wanted-nobody: "<gray>Nobody to announce: too few players online, or nobody alive."
  reloaded: "<green>LifestealPlus reloaded. Everything in config.yml and messages.yml looks fine."
