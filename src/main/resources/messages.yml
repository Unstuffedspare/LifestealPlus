  none: "<gray><player> shares no address with any other account."
  # <player>
  header: "<gold><player> shares an address with:"
  # <name>, <hearts>
  line: " <white><name></white> <gray>(<hearts> hearts)"
  flags-none: "<gray>No kills between linked accounts so far."
  flags-header: "<gold>Kills between accounts sharing an address <gray>(newest first)"
  # <time>, <killer>, <victim>
  flags-line: " <gray><time></gray> <white><killer></white> killed <white><victim></white>"

# ---- Heart ledger (admins only) --------------------------------------------
