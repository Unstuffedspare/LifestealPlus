# ---- Alt detection (admins only) -------------------------------------------
alts:
  # Admins only. <killer>, <victim>
  linked-kill: "<gold>⚠ <killer> killed <victim>, and they've logged in from the same address.</gold> <gray>Could be farming, could be housemates: /lifesteal alts <killer>"
