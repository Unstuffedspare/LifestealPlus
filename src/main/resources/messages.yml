  no-blood-moon: "<gray>No Blood Moon is up."
  blood-moon-already: "<gray>A Blood Moon is already up."
  airdrop-busy: "<gray>A crate is already on its way or waiting."
  no-finale: "<gray>No finale is running."
  finale-already: "<gray>The finale is already running."
  # <player>, <amount>, <kind>
  items-given: "<green>Gave <player> <amount> <kind> item(s)."
