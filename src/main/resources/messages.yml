  # <state>
  status-airdrop: "<gold>Next airdrop:</gold> <state>"
  # <state>
  status-finale: "<gold>Finale:</gold> <state>"
  state-now: "up now"
  # <time>
  state-in: "in <time>"
  state-not-scheduled: "not scheduled (switched off, or one is in progress)"
