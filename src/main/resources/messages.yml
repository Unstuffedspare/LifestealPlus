  preset-change: "<dark_gray>- <gray><setting>: <white><from></white> -> <yellow><to>"
  # <n>
  preset-more: "<dark_gray>...and <n> more"
  hint-preset: "<dark_gray>Click to apply"
  preset-confirm: "<gold>Click again to apply"

# ---- Presets (/lifesteal preset) --------------------------------------------
preset:
  list-header: "<gold>Presets</gold> <gray>(click one to see what it would change):"
  # <preset>, <description>
  list-entry: "<click:run_command:'/lifesteal preset <preset>'><yellow><u><preset></u></yellow></click> <gray>- <description>"
  # <preset>, <description>
  list-in-use: "<green><preset></green> <dark_gray>(in use)</dark_gray> <gray>- <description>"
  # <preset>, <n>
  would-change: "<gold>The <preset> preset would change <n> setting(s):"
  # <setting>, <from>, <to>
  change: "<dark_gray>- <gray><setting>: <white><from></white> -> <yellow><to>"
  # <preset>
  confirm: "<click:run_command:'/lifesteal preset <preset> confirm'><green><u>[Apply]</u></green></click> <gray>or type /lifesteal preset <preset> confirm"
  # <preset>, <n>
  applied: "<green>Applied the <preset> preset (<n> setting(s) changed)."
  # <preset>
  in-use: "<gray>Your settings already match the <preset> preset."
  # <preset>
  unknown: "<red>There's no preset called <preset>. Try casual, standard or hardcore."

# ---- Kill streaks ----------------------------------------------------------
streak:
  # <player>, <n>
  milestone: "<gold>🔥 <player> is on a <n>-kill streak!"
  # <killer>, <victim>, <n>
  ended: "<yellow><killer> ended <victim>'s <n>-kill streak."
  # <killer>, <victim>, <n>, <bonus>
  shutdown: "<gold><killer> ended <victim>'s <n>-kill streak and took <bonus> bonus heart(s) for it!"
  # /streak. <player>, <current>, <best>
  status: "<gold>🔥 <player></gold> <gray>has</gray> <white><current></white> <gray>kill(s) in a row right now. Best this season:</gray> <white><best></white>"

# ---- The "while you were away" summary -------------------------------------
recap:
  # <time>
  header: "<gold>While you were away (<time>):"
  # <text>
  line: "<dark_gray>- </dark_gray><text>"
  # <n>
  more: "<gray>...and <n> more. <white>/news</white> shows the latest."

# ---- /news, and the items in the summary -----------------------------------
news:
  header: "<gold>Latest news:"
  # <ago>, <text>
  line: "<dark_gray><ago> ago</dark_gray> <text>"
  empty: "<gray>Nothing has happened yet."
  # Each news.* message is one item in /news and the recap. <player>
  eliminated: "<red><player></red> <gray>was eliminated."
  # <player>, <other> (the killer)
  eliminated-by: "<red><player></red> <gray>was eliminated by</gray> <white><other></white><gray>."
  # <player>, <n>
  revived: "<green><player></green> <gray>came back with <n> hearts."
  # <player>, <n>
  streak: "<gold><player></gold> <gray>reached a <n>-kill streak."
  # <player> (on the streak), <other>, <n>
  streak-ended: "<white><other></white> <gray>ended</gray> <gold><player></gold><gray>'s <n>-kill streak."
  # <player>, <n>
  bounty: "<gray>A bounty went up on</gray> <white><player></white> <gray>(<n> hearts in total)."
  # <n> (the kill multiplier)
  blood-moon: "<dark_red>A Blood Moon rose."
  # <player>
  airdrop: "<white><player></white> <gray>looted an airdrop."
  finale: "<gold>The season finale began."
  # <player>
  finale-winner: "<gold><player> won the season finale!"

# ---- Importing from LifeStealZ (admins) ------------------------------------
import:
  # /lifesteal import lifestealz. <file>
  reading: "<gray>Reading <file>..."
  # <file>
  not-found: "<red>Can't find plugins/LifeStealZ/<file>. Leave the file out to use LifeStealZ's userData.db, or name a CSV from /lifestealz data export."
  unreadable: "<red>That file couldn't be read as LifeStealZ data; the details are in the server log."
  empty: "<gray>There are no players in that file."
  # <total>, <alive>, <eliminated>, <known>
  preview: "<gold>Ready to import <total> players from LifeStealZ:</gold> <gray><alive> with hearts, <eliminated> eliminated (they'll go to Purgatory), <known> already on this server (their hearts will be replaced)."
  # <n>
  skipped: "<yellow><n> line(s) couldn't be read and will be left out."
  # <n>, <cap>, <names>
  capped: "<yellow><n> player(s) had more than this server's cap and will arrive with <cap>: <names>"
  # <n>
  banned: "<yellow><n> eliminated player(s) are banned (LifeStealZ bans by default). Confirm with 'unban' so they can join and reach Purgatory."
  lifestealz-running: "<red>LifeStealZ is still running. Remove its jar and restart before importing, or the two plugins will fight over hearts."
  confirm-hint: "<yellow>Run <white>/lifesteal import confirm</white> (or <white>/lifesteal import confirm unban</white>) within 60 seconds to go ahead."
  nothing-to-confirm: "<gray>Nothing to confirm. Start with /lifesteal import lifestealz."
  failed: "<red>The import failed and nothing was changed; the details are in the server log."
  # <total>, <created>, <updated>
  done: "<green>Imported <total> players from LifeStealZ: <created> new here, <updated> updated."
  # <n>
  unbanned: "<green>Unbanned <n> eliminated player(s) so they can reach Purgatory."
  # <n>
  items-converted: "<gray>Your old LifeStealZ hearts became <red><n> Heart item(s)</red>."
