# Presets change a batch of settings at once, from /lifesteal settings or with
# /lifesteal preset <name>. Every preset covers the same settings: anything one preset
# lists that another doesn't goes back to its default, so applying a preset always gives
# the same result whatever was set before. Settings no preset mentions are left alone.

casual:
  description: "Relaxed. Only other players cost you hearts, newcomers are protected for longer, and coming back from elimination is easier."
  settings:
    hearts:
      natural-death-loss: 0
      revive: 5
    repeat-kills:
      cooldown-hours: 12
    streaks:
      shutdown-bonus-hearts: 0
    newbie-shield:
      hours: 6
      expires-after-days: 7
    last-stand:
      hearts: 2
    most-wanted:
      enabled: false
    purgatory:
      fragments-needed: 2
      trial-cooldown-minutes: 10
      difficulty: 0.75
    rifts:
      cost: 4
    revival-votes:
      hearts-needed: 4
      min-players: 2
    blood-moon:
      kill-multiplier: 1
    heart-items:
      decay:
        days: 7

smp:
  description: "For a group of friends. Fights matter, but the world is forgiving and there are plenty of ways back."
  settings:
    newbie-shield:
      hours: 4
    streaks:
      shutdown-bonus-hearts: 0
    most-wanted:
      enabled: false
    revival:
      cooldown-minutes: 5
    rifts:
      cost: 5
    rewards:
      playtime-hours: 1

team:
  description: "For playing in pairs and groups. Blood Pacts last, gifts are free, and friends can vote each other back cheaply."
  settings:
    repeat-kills:
      cooldown-hours: 12
    most-wanted:
      enabled: false
    blood-pacts:
      break-cooldown-hours: 72
    trading:
      tax-percent: 0
    rifts:
      cost: 4
    revival-votes:
      hearts-needed: 4
      min-players: 2

standard:
  description: "The defaults the plugin ships with. A fair fight with a way back."
  settings: {}

competitive:
  description: "For tournaments. Only PvP costs hearts, nobody can buy, craft or gift them, and there's no grinding for them."
  settings:
    hearts:
      natural-death-loss: 0
    repeat-kills:
      cooldown-hours: 3
    streaks:
      shutdown-at: 3
    newbie-shield:
      hours: 1
      expires-after-days: 1
    combat-log:
      tag-seconds: 20
      body-seconds: 45
    most-wanted:
      interval-minutes: 60
    heart-items:
      recipe:
        enabled: false
    trading:
      enabled: false
    rewards:
      enabled: false
    revival-charm:
      enabled: false

hardcore:
  description: "Brutal. Fewer hearts, short protection, longer combat tags, no crafted Hearts, and a hard road back from elimination."
  settings:
    hearts:
      starting: 8
      max: 15
      revive: 2
      natural-death-drops: false
    repeat-kills:
      cooldown-hours: 2
    streaks:
      shutdown-at: 3
      shutdown-bonus-hearts: 2
    newbie-shield:
      hours: 1
      expires-after-days: 1
    combat-log:
      tag-seconds: 30
      body-seconds: 60
    last-stand:
      enabled: false
    most-wanted:
      interval-minutes: 60
      precision-blocks: 50
      min-players-online: 2
    purgatory:
      fragments-needed: 4
      trial-cooldown-minutes: 30
      difficulty: 1.5
    rifts:
      cost: 10
    revival-votes:
      hearts-needed: 10
      min-players: 4
    blood-moon:
      kill-multiplier: 3
    heart-items:
      decay:
        days: 2
      recipe:
        enabled: false

ultra-hardcore:
  description: "One mistake and you're out. Five hearts, no protection, no totems, and Purgatory is the only way back."
  settings:
    hearts:
      starting: 5
      max: 10
      revive: 1
      natural-death-drops: false
    newbie-shield:
      enabled: false
    last-stand:
      enabled: false
    rifts:
      enabled: false
    revival-votes:
      enabled: false
    revival-charm:
      enabled: false
    purgatory:
      fragments-needed: 5
      difficulty: 2.0
    combat-items:
      totems: false
    heart-items:
      recipe:
        enabled: false
    trading:
      enabled: false
    rewards:
      enabled: false

anarchy:
  description: "No safety nets. No newbie shields, no farming protection, logging out mid-fight is fair game, and Blood Moons come every few days."
  settings:
    repeat-kills:
      enabled: false
    newbie-shield:
      enabled: false
    combat-log:
      enabled: false
    alt-detection:
      enabled: false
    most-wanted:
      interval-minutes: 30
      precision-blocks: 25
      min-players-online: 2
    blood-moon:
      every-days: 3
      kill-multiplier: 3
